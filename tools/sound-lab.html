<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffd24a' stroke-width='3'/%3E%3Cpath d='M16 1v9M16 22v9M1 16h9M22 16h9' stroke='%23ffd24a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e02424'/%3E%3C/svg%3E">
<style>
  :root { --bg: #15161a; --panel: #1f2026; --panel2: #26272e; --line: #34353d; --text: #e8e8ea; --dim: #9a9ba3; --accent: #ffd24a; --go: #7CFC00; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 'Segoe UI', Arial, sans-serif; overflow: hidden; }
  a { color: var(--accent); }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px Consolas, monospace; color: var(--text); }

  /* the whole page fits the window: a header, then the list and the sound side by side, each scrolling on its own */
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 19px; color: var(--accent); }
  header .help { color: var(--dim); font-size: 12.5px; flex: 1; min-width: 240px; }
  .panes { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

  /* list */
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .search { margin: 10px 12px 6px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; }
  .search:focus { outline: none; border-color: var(--accent); }
  .items { overflow-y: auto; padding: 0 8px 16px; }
  .group { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 6px 4px; display: flex; justify-content: space-between; align-items: center; }
  .group button { background: none; border: 0; color: var(--accent); font: 11px 'Segoe UI', Arial, sans-serif; cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0; }
  .item { display: flex; width: 100%; align-items: baseline; gap: 8px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--text); font: inherit; cursor: pointer; }
  .item:hover { background: var(--panel); }
  .item.active { background: var(--panel2); box-shadow: inset 3px 0 0 var(--go); }
  .item b { font-weight: 600; white-space: nowrap; }
  .item span { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; align-self: center; visibility: hidden; }
  .item.tweaked .dot { visibility: visible; }

  /* the selected sound */
  .detail { overflow-y: auto; padding: 18px 24px 28px; min-height: 0; }
  .detail-inner { max-width: 820px; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title h2 { margin: 0; font-size: 22px; }
  .title .kind { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .desc { color: var(--dim); margin: 4px 0 14px; }
  .play-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .play { flex: 1; min-width: 200px; padding: 13px; font: bold 16px 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--go); border: 2px solid var(--go); border-radius: 8px; cursor: pointer; }
  .play:hover { background: rgba(124,252,0,0.08); }
  .btn { padding: 8px 14px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .wave { position: relative; margin: 14px 0 6px; height: 96px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .wave canvas { width: 100%; height: 100%; display: block; }
  .wave .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12.5px; }
  .section { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 4px 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  .row { display: grid; grid-template-columns: 130px 1fr 48px; gap: 10px; align-items: center; }
  .row label { color: var(--dim); font-size: 13px; }
  .row output { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; }
  .row.changed label { color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .out { display: flex; gap: 8px; align-items: stretch; }
  .out code { flex: 1; background: #0f1013; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 12px Consolas, monospace; overflow-x: auto; white-space: nowrap; }

  /* narrow windows and phones: the list on top (its own scroll), the sound below */
  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .panes { grid-template-columns: 1fr; }
    .list { border-right: 0; border-bottom: 1px solid var(--line); }
    .items { max-height: 38vh; }
    .detail { padding: 16px; }
    .row { grid-template-columns: 110px 1fr 44px; }
    .knobs { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sound Lab</h1>
    <div class="help">Every sound the game plays, played the way the game plays it (from <code>sounds.js</code>).
      <kbd>Space</kbd> play &nbsp; <kbd>↑</kbd><kbd>↓</kbd> next sound &nbsp; <kbd>B</kbd> burst (rifle, AK) &nbsp; <kbd>/</kbd> search</div>
    <a href="../index.html">Back to the game</a>
  </header>
  <div class="panes">
    <nav class="list" aria-label="Sounds">
      <input class="search" id="search" type="search" placeholder="Search sounds" autocomplete="off">
      <div class="items" id="items"></div>
    </nav>
    <section class="detail" aria-live="polite">
      <div class="detail-inner">
        <div class="title"><h2 id="d-name"></h2><span class="kind" id="d-kind"></span></div>
        <p class="desc" id="d-desc"></p>
        <div class="play-row">
          <button class="play" id="play">▶ PLAY (Space)</button>
          <button class="btn" id="burst" hidden>Burst (B)</button>
        </div>
        <div class="wave" id="wave"><canvas id="wave-canvas"></canvas><div class="note" id="wave-note"></div></div>
        <div class="section"><span>Settings</span><button class="btn" id="reset">Reset to the game's values</button></div>
        <div class="knobs" id="knobs"></div>
        <div class="section"><span>Current values</span></div>
        <div class="out"><code id="out"></code><button class="btn" id="copy">Copy</button></div>
      </div>
    </section>
  </div>
</div>

<script src="../sounds.js"></script>
<script>
(function () {
  // ---------------- what the game plays (mirrors game.js; keep in step when changing a sound there) ----------------
  // guns: which recording, and how playShotSound processes it
  const GUNS = [
    { id: "sniper", name: "Sniper shot", by: "\"Rifle Gun Shot 01\" by LilMati", rec: "rifleShot", lowcut: 60, length: 1.8, gain: 1, bolt: true },
    { id: "rifle", name: "Rifle shot", by: "\"AssaultRifle1.wav\" by SuperPhat", rec: "arShot", lowcut: 80, length: 0.6, gain: 0.8, burst: true },
    { id: "ak", name: "AK shot", by: "\"AK47 Shot\" by LeMudCrab", rec: "akShot", lowcut: 80, length: 0.6, gain: 0.85, burst: true },
    { id: "shotgun", name: "Shotgun shot", by: "\"Shotgun Shot 03.wav\" by LilMati", clip: "shotgunShot", lowcut: 45, length: 1.4, gain: 1.05, pump: true },
    { id: "deagle", name: "Deagle shot", by: "\"Gunshot.wav\" by Cloud-10", rec: "pistolShot", lowcut: 60, length: 1.8, gain: 0.9 },
    { id: "bolt", name: "Sniper bolt", by: "\"Sniper Rifle M24 SFX\" by kennysvoice", boltClip: true },
  ];
  // gun actions: clacks cut from the bolt recording (ACTION_CLACKS / playActionClack in game.js):
  // [label, note, rate, [which, delay], ...]
  const ACTIONS = [
    ["Shotgun pump", "back, then forward 0.17 s later", 1.2, ["back", 0], ["forward", 0.17]],
    ["Charging handle", "rifle and AK reload", 1.5, ["back", 0], ["forward", 0.12]],
    ["Slide release", "Deagle reload", 1.6, ["forward", 0]],
  ];
  const ACTION_CLACKS = { back: [0.70, 0.15], forward: [1.16, 0.16] };
  // clips: [group, name in TSB_SOUNDS.sfx, label, volume, pitch, reverb, note] as the game plays them
  const CLIPS = [
    ["Movement", "step", "Footstep", 0.15, 1, 0.05, "4 variants, quieter at walking pace"],
    ["Movement", "land", "Landing", 0.25, 1, 0.08, "louder the harder you land"],
    ["Movement", "slide", "Slide", 0.35, 1, 0.1, ""],
    ["Movement", "wallBounce", "Wall bounce", 0.6, 1, 0.1, ""],
    ["Movement", "wallBounce", "Perfect wall bounce", 0.6, 1, 0.1, "the bounce plus a generated ping", "perfect"],
    ["Movement", "jumpPad", "Jump pad", 0.7, 1.05, 0.25, "normal pad"],
    ["Movement", "jumpPad", "Mega jump pad", 0.7, 0.8, 0.25, "same clip, deeper"],
    ["Hits and knife", "targetDing", "Target hit", 0.55, 0.92, 0.2, "rises with the multiplier"],
    ["Hits and knife", "knifeSwing", "Knife swing", 0.6, 1.15, 0.1, "also the throw"],
    ["Hits and knife", "knifeHit", "Knife hit", 0.6, 1, 0.2, ""],
    ["Hits and knife", "knifeStick", "Knife sticks", 0.6, 1, 0.15, "quieter the further away it lands"],
    ["Reloads and brass", "magOut", "Magazine out", 0.55, 1, 0.1, ""],
    ["Reloads and brass", "magIn", "Magazine in", 0.55, 1, 0.1, ""],
    ["Reloads and brass", "shellInsert", "Shell insert", 0.55, 1, 0.1, "shotgun"],
    ["Reloads and brass", "magLand", "Magazine lands", 0.5, 1, 0.15, "the dropped mag"],
    ["Reloads and brass", "casing", "Casing", 0.35, 1.05, 0.15, "each bounce"],
    ["Reloads and brass", "dryFire", "Dry fire", 0.6, 1, 0.1, "empty gun"],
    ["Handling", "draw", "Weapon switch", 0.5, 1, 0.1, ""],
    ["Handling", "inspect", "Inspect", 0.45, 1, 0.1, ""],
    ["Handling", "scope", "Scope in", 0.45, 1, 0.1, ""],
    ["Handling", "scope", "Scope out", 0.45, 0.82, 0.1, "same clip, lower"],
  ];

  const P = (pitch, crack, bright, mid, body, boom, slap, tail, tailLen, wet, drive, comp, swell) =>
    ({ pitch, crack, bright, mid, body, boom, slap, tail, tailLen, wet, drive, comp, swell });
  const SYNTH = [
    { id: "1",  key: "1", name: "1. Arena",        desc: "Lab 1 #10, the closest synth.",           v: P(1.20, 1.0, 0.9, 0.9, 0.8, 0.8, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 22) },
    { id: "2",  key: "2", name: "2. Less hiss",    desc: "Bright edge and snap pulled back.",       v: P(1.20, 0.7, 0.3, 0.9, 0.8, 0.8, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 22) },
    { id: "3",  key: "3", name: "3. No hiss",      desc: "Bright edge off, more bark.",             v: P(1.20, 0.5, 0.0, 1.1, 0.9, 0.8, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 22) },
    { id: "4",  key: "4", name: "4. Bigger room",  desc: "More reverb and a longer roll.",          v: P(1.20, 0.8, 0.5, 0.9, 0.8, 0.8, 0.4, 0.8, 2.0, 0.40, 0.6, 0.8, 22) },
    { id: "5",  key: "5", name: "5. Higher",       desc: "Pitched up, less hiss.",                  v: P(1.35, 0.8, 0.5, 0.9, 0.8, 0.8, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 22) },
    { id: "6",  key: "6", name: "6. Lower",        desc: "Pitched down, more boom.",                v: P(1.05, 0.8, 0.5, 0.9, 0.8, 1.1, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 22) },
    { id: "7",  key: "7", name: "7. Punchy",       desc: "Aimed at a game-style AWP.",              v: P(1.15, 1.0, 0.9, 1.0, 0.8, 0.8, 0.35, 0.35, 1.1, 0.08, 0.6, 0.8, 18) },
    { id: "8",  key: "8", name: "8. Punchier",     desc: "More squash and grit, quicker swell.",    v: P(1.20, 0.8, 0.5, 1.0, 0.8, 0.8, 0.4, 0.6, 1.8, 0.25, 0.8, 1.0, 12) },
    { id: "9",  key: "9", name: "9. Slower swell", desc: "Body rolls in later after the snap.",     v: P(1.20, 0.8, 0.5, 0.9, 0.8, 0.8, 0.4, 0.6, 1.8, 0.25, 0.6, 0.8, 40) },
    { id: "10", key: "0", name: "10. Dark & big",  desc: "Least hiss, most weight and space.",      v: P(1.15, 0.6, 0.2, 0.7, 1.0, 1.2, 0.4, 0.8, 2.0, 0.35, 0.6, 0.8, 22) },
  ];

  // ---------------- state ----------------
  const ITEMS = [];   // everything selectable, in list order
  for (const g of GUNS) ITEMS.push(Object.assign({ key: "gun:" + g.id, kind: "gun", group: "Guns" }, g));
  ACTIONS.forEach(([name, note, rate, ...steps], i) => ITEMS.push({ key: "act:" + i, kind: "action", group: "Gun actions", name, note, rate, steps }));
  CLIPS.forEach(([group, clip, name, vol, rate, wet, note, extra], i) => ITEMS.push({ key: "clip:" + i, kind: "clip", group, clip, name, vol, rate, wet, note, extra }));
  for (const s of SYNTH) ITEMS.push(Object.assign({ key: "synth:" + s.id, kind: "synth", group: "Old synth tries" }, s));
  let current = ITEMS[0];
  const tweak = {};   // per item: knob values

  const GUN_KNOBS = [["pitch", "Pitch", 0.7, 1.6, 0.01], ["lowcut", "Cut lows (Hz)", 20, 800, 5], ["punch", "Punch", 0, 1, 0.01],
    ["length", "Length (s)", 0.2, 3, 0.05], ["gain", "Volume", 0.2, 1.6, 0.01]];
  const CLIP_KNOBS = [["vol", "Volume", 0, 1.5, 0.01], ["rate", "Pitch", 0.5, 1.8, 0.01], ["wet", "Room reverb", 0, 0.6, 0.01]];
  const SYNTH_KNOBS = [["pitch", "Pitch", 0.7, 1.6, 0.01], ["crack", "Snap", 0, 1.5, 0.01], ["bright", "Bright edge", 0, 1.5, 0.01],
    ["mid", "Mid bark", 0, 1.5, 0.01], ["body", "Body", 0, 1.5, 0.01], ["boom", "Low boom", 0, 1.5, 0.01], ["slap", "Slapback", 0, 1, 0.01],
    ["tail", "Tail", 0, 1, 0.01], ["tailLen", "Tail length (s)", 0.3, 2, 0.05], ["wet", "Room reverb", 0, 0.6, 0.01],
    ["drive", "Grit", 0, 1, 0.01], ["comp", "Compression", 0, 1, 0.01], ["swell", "Swell (ms)", 0, 60, 1]];
  const ACTION_KNOBS = [["rate", "Speed", 0.8, 2, 0.01], ["vol", "Volume", 0, 1.5, 0.01]];
  function knobsFor(it) {
    if (it.kind === "gun") return it.boltClip ? [["pitch", "Speed", 0.8, 1.6, 0.01]] : GUN_KNOBS;
    return it.kind === "clip" ? CLIP_KNOBS : it.kind === "action" ? ACTION_KNOBS : SYNTH_KNOBS;
  }
  function defaults(it) {
    if (it.kind === "gun") return it.boltClip ? { pitch: 1.25 } : { pitch: 1, lowcut: it.lowcut, punch: 0.4, length: it.length, gain: it.gain };
    if (it.kind === "clip") return { vol: it.vol, rate: it.rate, wet: it.wet };
    if (it.kind === "action") return { rate: it.rate, vol: 0.85 };
    return Object.assign({}, it.v);
  }
  function values(it) { return tweak[it.key] || (tweak[it.key] = defaults(it)); }
  function isTweaked(it) { const d = defaults(it), v = values(it); return Object.keys(d).some((k) => Math.abs(d[k] - v[k]) > 1e-9); }

  // ---------------- list ----------------
  const fmt = (v) => (Number.isInteger(v) && Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2));
  const itemsEl = document.getElementById("items"), searchEl = document.getElementById("search");
  const buttons = new Map();
  let synthOpen = false;
  function buildList() {
    itemsEl.textContent = "";
    buttons.clear();
    const q = searchEl.value.trim().toLowerCase();
    let group = null;
    for (const it of ITEMS) {
      const note = it.kind === "gun" ? it.by : it.kind === "synth" ? it.desc : it.note;
      if (q && !(it.name + " " + note).toLowerCase().includes(q)) continue;
      if (it.group !== group) {
        group = it.group;
        const h = document.createElement("div");
        h.className = "group";
        h.textContent = group;
        if (group === "Old synth tries" && !q) {
          const t = document.createElement("button");
          t.textContent = synthOpen ? "hide" : "show";
          t.addEventListener("click", () => { synthOpen = !synthOpen; buildList(); });
          h.appendChild(t);
        }
        itemsEl.appendChild(h);
      }
      if (it.kind === "synth" && !synthOpen && !q) continue;
      const b = document.createElement("button");
      b.className = "item" + (it === current ? " active" : "") + (isTweaked(it) ? " tweaked" : "");
      b.innerHTML = '<i class="dot" title="changed from the game"></i><b></b><span></span>';
      b.querySelector("b").textContent = it.name;
      b.querySelector("span").textContent = note || "";
      b.addEventListener("click", () => { select(it); play(); });
      itemsEl.appendChild(b);
      buttons.set(it.key, b);
    }
  }
  searchEl.addEventListener("input", buildList);
  function visibleItems() { return ITEMS.filter((it) => buttons.has(it.key)); }

  // ---------------- the selected sound ----------------
  const knobsEl = document.getElementById("knobs");
  function select(it) {
    current = it;
    for (const [key, b] of buttons) b.classList.toggle("active", key === it.key);
    const b = buttons.get(it.key);
    if (b) b.scrollIntoView({ block: "nearest" });
    document.getElementById("d-name").textContent = it.name;
    document.getElementById("d-kind").textContent = it.group;
    document.getElementById("d-desc").textContent =
      it.kind === "gun" ? "Recording: " + it.by + "." + (it.bolt ? " Plays the bolt after the shot, as in game." : "") + (it.pump ? " Plays the pump after the shot, as in game." : "")
      : it.kind === "clip" ? "Clip \"" + it.clip + "\" in sounds.js" + (it.note ? ", " + it.note : "") + ". CC0 recording, credited in sounds.js."
      : it.kind === "action" ? "Clacks cut from the sniper's bolt recording, sped up (" + it.note + ")."
      : it.desc + " Generated live, not a recording (the sniper shot used before the recordings).";
    document.getElementById("burst").hidden = !it.burst;
    document.getElementById("reset").textContent = it.kind === "synth" ? "Reset to the preset" : "Reset to the game's values";
    knobsEl.textContent = "";
    const v = values(it), d = defaults(it);
    for (const [k, label, min, max, step] of knobsFor(it)) {
      const row = document.createElement("div");
      row.className = "row" + (Math.abs(v[k] - d[k]) > 1e-9 ? " changed" : "");
      row.innerHTML = "<label></label><input type=range><output></output>";
      const id = "k-" + k;
      row.querySelector("label").textContent = label;
      row.querySelector("label").htmlFor = id;
      const inp = row.querySelector("input"), out = row.querySelector("output");
      inp.id = id; inp.min = min; inp.max = max; inp.step = step; inp.value = v[k]; out.textContent = fmt(v[k]);
      inp.addEventListener("input", () => {
        v[k] = parseFloat(inp.value); out.textContent = fmt(v[k]);
        row.classList.toggle("changed", Math.abs(v[k] - d[k]) > 1e-9);
        markTweaked(); writeOut(); drawWave();
      });
      let pointer = false, kbTimer = 0;
      inp.addEventListener("pointerdown", () => { pointer = true; });
      inp.addEventListener("pointerup", () => setTimeout(() => { pointer = false; }, 0));
      inp.addEventListener("change", () => {
        if (pointer) { inp.blur(); play(); }                                  // let go of a slider: hear it
        else { clearTimeout(kbTimer); kbTimer = setTimeout(play, 250); }      // arrow keys: hear it once you stop
      });
      knobsEl.appendChild(row);
    }
    writeOut();
    drawWave();
  }
  function markTweaked() { const b = buttons.get(current.key); if (b) b.classList.toggle("tweaked", isTweaked(current)); }
  function writeOut() {
    document.getElementById("out").textContent = current.name + ": " + Object.entries(values(current)).map(([k, x]) => k + "=" + fmt(x)).join("  ");
  }
  document.getElementById("reset").addEventListener("click", (e) => { e.currentTarget.blur(); tweak[current.key] = defaults(current); markTweaked(); select(current); });
  document.getElementById("copy").addEventListener("click", (e) => {
    const btn = e.currentTarget, text = document.getElementById("out").textContent;
    btn.blur();
    const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
  });

  function gunBuf(it) { return it.clip ? clipBufs[it.clip] : bufs[it.rec]; }
  // seconds of the recording a gun shot plays: its Length at its pitch, but never past the end
  function gunSpan(it) { const v = values(it), b = gunBuf(it); return b ? Math.min(v.length * v.pitch, b.duration) : v.length * v.pitch; }

  // ---------------- waveform with a playhead ----------------
  const canvas = document.getElementById("wave-canvas"), noteEl = document.getElementById("wave-note");
  let playhead = null;   // { start (ctx time), dur }
  function waveSource(it) {
    if (it.kind === "synth" || !ready) return null;
    if (it.kind === "clip") return { buf: clipBufs[it.clip === "step" ? "step1" : it.clip], from: 0, to: null, rate: values(it).rate };
    if (it.boltClip) return { buf: bufs.boltCycle, from: 0.42, to: 1.47, rate: values(it).pitch };
    if (it.kind === "action") { const [at, len] = ACTION_CLACKS[it.steps[0][0]]; return { buf: bufs.boltCycle, from: at, to: at + len, rate: values(it).rate }; }
    const v = values(it);
    return { buf: gunBuf(it), from: 0, to: gunSpan(it), rate: v.pitch };
  }
  function drawWave() {
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const g = canvas.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const src = waveSource(current);
    if (!src || !src.buf) {
      noteEl.textContent = current.kind === "synth" ? "Generated live, so there's no recording to show." : (decodedOnce ? "" : "Loading sounds…");
      return;
    }
    noteEl.textContent = "";
    const d = src.buf.getChannelData(0), sr = src.buf.sampleRate;
    const i0 = Math.floor(src.from * sr), i1 = Math.min(d.length, src.to ? Math.floor(src.to * sr) : d.length);
    const per = (i1 - i0) / w;
    g.fillStyle = "#ffd24a";
    for (let x = 0; x < w; x++) {
      let lo = 0, hi = 0;
      const a = i0 + Math.floor(x * per), e = Math.max(a + 1, Math.min(i1, i0 + Math.floor((x + 1) * per)));
      for (let i = a; i < e; i++) { const s = d[i]; if (s < lo) lo = s; if (s > hi) hi = s; }
      g.fillRect(x, h / 2 - hi * h * 0.46, 1, Math.max(1, (hi - lo) * h * 0.46));
    }
    if (playhead && ctx) {
      const t = (ctx.currentTime - playhead.start) / playhead.dur;
      if (t >= 0 && t <= 1) { g.fillStyle = "#7CFC00"; g.fillRect(Math.round(t * w), 0, 2, h); }
    }
  }
  let animating = false;
  function animate() {
    drawWave();
    if (playhead && ctx && ctx.currentTime - playhead.start <= playhead.dur) requestAnimationFrame(animate);
    else { playhead = null; animating = false; drawWave(); }
  }
  function startAnim() { if (!animating) { animating = true; requestAnimationFrame(animate); } }
  window.addEventListener("resize", drawWave);

  // ---------------- audio: the game's master chain ----------------
  let ctx = null, master = null, convolver = null, ready = null, decodedOnce = false;
  const bufs = {}, clipBufs = {};
  const rnd = (a, b) => a + Math.random() * (b - a);
  function makeImpulseResponse(duration, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * duration), imp = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = imp.getChannelData(c);
      for (let i = 0; i < len; i++) { const t = i / len, early = (i < rate * 0.06 && Math.random() < 0.02) ? 2.5 : 1; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * early; }
    }
    return imp;
  }
  function makeSaturationCurve(amount) {
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i * 2) / n - 1; curve[i] = Math.tanh(x * amount) / Math.tanh(amount); }
    return curve;
  }
  function decodeB64(b64) {
    if (!b64) return Promise.resolve(null);
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return ctx.decodeAudioData(bytes.buffer).catch(() => null);
  }
  // same as trimToFirstShot / trimLeadingSilence in game.js
  function trimToFirstShot(buf) {
    const sr = buf.sampleRate, ch = buf.numberOfChannels, mono = new Float32Array(buf.length);
    for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i] / ch; }
    let peak = 0; for (let i = 0; i < mono.length; i++) peak = Math.max(peak, Math.abs(mono[i]));
    let start = 0;
    for (let i = 0; i < mono.length; i++) if (Math.abs(mono[i]) > peak * 0.3) { start = Math.max(0, i - Math.floor(sr * 0.004)); break; }
    const win = Math.floor(sr * 0.005);
    let end = Math.min(mono.length, start + sr * 3.2), level = 0;
    for (let i = start + Math.floor(sr * 0.35); i + win < end; i += win) {
      let e = 0; for (let j = i; j < i + win; j++) e = Math.max(e, Math.abs(mono[j]));
      if (level > 0 && e > peak * 0.45 && e > level * 4) { end = i - Math.floor(sr * 0.01); break; }
      level = level ? level * 0.7 + e * 0.3 : e;
    }
    const len = Math.max(1, Math.floor(end - start)), out = ctx.createBuffer(2, len, sr);
    let pk = 0;
    for (let c = 0; c < 2; c++) { const src = buf.getChannelData(Math.min(c, ch - 1)), d = out.getChannelData(c); for (let i = 0; i < len; i++) { d[i] = src[start + i]; pk = Math.max(pk, Math.abs(d[i])); } }
    for (let c = 0; c < 2; c++) { const d = out.getChannelData(c); for (let i = 0; i < len; i++) d[i] *= 0.95 / (pk || 1); }
    return out;
  }
  function trimLeadingSilence(buf) {
    const d = buf.getChannelData(0);
    let i = 0; while (i < d.length && Math.abs(d[i]) < 0.004) i++;
    i = Math.max(0, i - Math.floor(buf.sampleRate * 0.001));
    if (i < 8) return buf;
    const out = ctx.createBuffer(buf.numberOfChannels, buf.length - i, buf.sampleRate);
    for (let c = 0; c < buf.numberOfChannels; c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i));
    return out;
  }
  let variants = [];
  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return ready; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    convolver = ctx.createConvolver(); convolver.buffer = makeImpulseResponse(1.9, 2.6);
    const wetGain = ctx.createGain(); wetGain.gain.value = 0.42;
    convolver.connect(wetGain).connect(master);
    for (let v = 0; v < 4; v++) variants.push(makeLayers());
    const S = window.TSB_SOUNDS || {};
    const jobs = [];
    for (const k of ["rifleShot", "arShot", "akShot", "pistolShot"]) jobs.push(decodeB64(S[k]).then((b) => { if (b) bufs[k] = trimToFirstShot(b); }));
    jobs.push(decodeB64(S.boltCycle).then((b) => { bufs.boltCycle = b; }));
    for (const [k, b64] of Object.entries(S.sfx || {})) jobs.push(decodeB64(b64).then((b) => { if (b) clipBufs[k] = trimLeadingSilence(b); }));
    ready = Promise.all(jobs).then(() => { decodedOnce = true; drawWave(); });
    return ready;
  }

  function playGun(it, v, now) {
    const buf = it.clip ? clipBufs[it.clip] : bufs[it.rec];
    if (!buf) return;
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = v.pitch * rnd(0.98, 1.02);
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = v.lowcut; hp.Q.value = 0.7;
    let node = src.connect(hp);
    if (v.punch > 0.01) {
      const c = ctx.createDynamicsCompressor();
      c.threshold.value = -6 - v.punch * 24; c.ratio.value = 2 + v.punch * 10; c.knee.value = 6; c.attack.value = 0.004; c.release.value = 0.15;
      node = node.connect(c);
    }
    const makeup = ctx.createGain(); makeup.gain.value = (1 + v.punch * 1.4) * v.gain;   // Punch 0.4 = the game's 1.56
    node = node.connect(makeup);
    const env = ctx.createGain();
    env.gain.setValueAtTime(1, now); env.gain.setValueAtTime(1, now + v.length * 0.5); env.gain.linearRampToValueAtTime(0, now + v.length);
    node.connect(env).connect(master);
    src.start(now); src.stop(now + v.length + 0.05);
  }
  function playBoltClip(now, rate, at, len, gain) {
    if (!bufs.boltCycle) return;
    const src = ctx.createBufferSource(); src.buffer = bufs.boltCycle; src.playbackRate.value = rate;
    const g = ctx.createGain(); g.gain.value = gain || 0.9;
    src.connect(g).connect(master);
    const send = ctx.createGain(); send.gain.value = 0.08; g.connect(send).connect(convolver);
    src.start(now, at, len);
  }
  // one gun action: each clack at its delay, at this item's speed; returns how long it lasts
  function playAction(it, now) {
    const v = values(it);
    let end = 0;
    for (const [which, delay] of it.steps) {
      const [at, len] = ACTION_CLACKS[which];
      playBoltClip(now + delay, v.rate * rnd(0.97, 1.03), at, len, v.vol);
      end = Math.max(end, delay + len / v.rate);
    }
    return end;
  }
  // the perfect-wall-bounce ping, generated like tone() and noiseHit() in game.js
  let noiseBuf = null;
  function routeOut(node, wet) {
    node.connect(master);
    if (wet > 0) { const sg = ctx.createGain(); sg.gain.value = wet; node.connect(sg).connect(convolver); }
  }
  function playPerfectCue(now, level) {
    if (!noiseBuf) {   // slightly correlated noise, as the game makes it
      const n = Math.floor(ctx.sampleRate), d = (noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate)).getChannelData(0);
      let last = 0;
      for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = 0.82 * last + 0.18 * w; d[i] = w * 0.75 + last * 0.6; }
    }
    const j = rnd(0.97, 1.03), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(500 * j, now); o.frequency.exponentialRampToValueAtTime(1150 * j, now + 0.16);
    g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.18 * level, now + 0.003); g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    o.connect(g); routeOut(g, 0.4); o.start(now); o.stop(now + 0.18);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.playbackRate.value = rnd(0.85, 1.18);
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1300 * rnd(0.94, 1.06); f.Q.value = 1.5;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, now); g2.gain.linearRampToValueAtTime(0.16 * level, now + 0.002); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    src.connect(f).connect(g2); routeOut(g2, 0.4); src.start(now); src.stop(now + 0.13);
  }
  function playClip(it, v, now) {
    if (it.extra === "perfect") playPerfectCue(now, v.vol / 0.6);
    const name = it.clip === "step" ? "step" + (1 + Math.floor(Math.random() * 4)) : it.clip;
    const buf = clipBufs[name];
    if (!buf) return;
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = v.rate * rnd(0.97, 1.03);
    const g = ctx.createGain(); g.gain.value = v.vol;
    src.connect(g).connect(master);
    if (v.wet > 0) { const send = ctx.createGain(); send.gain.value = v.wet; g.connect(send).connect(convolver); }
    src.start(now);
  }

  // ---------------- synth (Lab 1 engine) ----------------
  function makeLayers() {
    const sr = ctx.sampleRate, white = () => Math.random() * 2 - 1, k = (fc) => 1 - Math.exp(-2 * Math.PI * fc / sr);
    function mono(seconds, fill) {
      const len = Math.floor(sr * seconds), buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
      fill(d, len);
      let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(d[i]));
      if (peak > 0) for (let i = 0; i < len; i++) d[i] /= peak;
      return buf;
    }
    // snap: a high-passed N-wave, two needle-sharp clicks about 1 ms apart
    const crack = mono(0.012, (d, len) => {
      const T = Math.round(sr * rnd(0.0009, 0.0013)), kh = k(2500), kh2 = k(1200); let l1 = 0, l2 = 0;
      for (let i = 0; i < len; i++) {
        const x = (i < T ? 1 - 2 * i / T : 0) + white() * 0.35 * Math.exp(-i / (sr * 0.0007));
        l1 += kh * (x - l1); const h1 = x - l1; l2 += kh2 * (h1 - l2); d[i] = h1 - l2;
      }
    });
    // bright edge: broadband hiss gone in ~4 ms
    const bright = mono(0.03, (d, len) => {
      const kl = k(1800); let l = 0;
      for (let i = 0; i < len; i++) { const w = white(); l += kl * (w - l); d[i] = (w - l) * Math.exp(-i / (sr * 0.0035)); }
    });
    // mid bark: roughly 900 Hz - 3 kHz
    const mid = mono(0.12, (d, len) => {
      const ka = k(3000), kb = k(900); let a = 0, a2 = 0, b = 0;
      for (let i = 0; i < len; i++) {
        const w = white(); a += ka * (w - a); a2 += ka * (a - a2); b += kb * (a2 - b);
        d[i] = (a2 - b) * Math.min(i / (sr * 0.0004), 1) * Math.exp(-i / (sr * 0.028));
      }
    });
    // body: mid-band blast with fixed filters (a swept one sounds like a "zap")
    const body = mono(0.25, (d, len) => {
      const ka = k(2200), kb = k(250); let a = 0, b = 0;
      for (let i = 0; i < len; i++) {
        const w = white(); a += ka * (w - a); b += kb * (a - b);
        d[i] = (a - b) * Math.min(i / (sr * 0.0002), 1) * Math.exp(-i / (sr * 0.02));
      }
    });
    // boom: low noise, not a tone, so nothing slides in pitch
    const boom = mono(0.6, (d, len) => {
      const kl = k(160); let a = 0, b = 0, c = 0;
      for (let i = 0; i < len; i++) {
        const w = white(); a += kl * (w - a); b += kl * (a - b); c += kl * (b - c);
        d[i] = c * Math.min(i / (sr * 0.003), 1) * Math.exp(-i / (sr * 0.11));
      }
    });
    // tail: smooth and steady (a slow swell in loudness reads as "boing")
    const tailLen = Math.floor(sr * 2.2), tail = ctx.createBuffer(2, tailLen, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = tail.getChannelData(ch), ka = k(550), kb = k(200);
      let a1 = 0, a2 = 0, b1 = 0, b2 = 0, peak = 0;
      for (let i = 0; i < tailLen; i++) {
        const t = i / sr, w = white();
        a1 += ka * (w - a1); a2 += ka * (a1 - a2); b1 += kb * (w - b1); b2 += kb * (b1 - b2);
        const r = Math.min(Math.max((t - 0.03) / 0.15, 0), 1);
        const v = r * r * (3 - 2 * r) * (a2 * Math.exp(-t / 0.25) + b2 * 1.8 * Math.exp(-t / 0.55));
        d[i] = v; peak = Math.max(peak, Math.abs(v));
      }
      for (let i = 0; i < tailLen; i++) d[i] /= peak;
    }
    return { crack, bright, mid, body, boom, tail };
  }

  function playSynth(now) {
    const st = values(current), v = variants[Math.floor(Math.random() * variants.length)];
    // one bus with headroom; grit pushes it into a soft clipper on purpose
    const bus = ctx.createGain(); bus.gain.value = 0.5 + st.drive * 0.8;
    let out = bus;
    if (st.drive > 0.01) {
      const ws = ctx.createWaveShaper(); ws.curve = makeSaturationCurve(1 + st.drive * 4); ws.oversample = "4x";
      bus.connect(ws); out = ws;
    }
    // compressor with a slow-ish attack so the snap slips through before it clamps
    if (st.comp > 0.01) {
      const c = ctx.createDynamicsCompressor();
      c.threshold.value = -8 - st.comp * 22; c.ratio.value = 3 + st.comp * 9;
      c.knee.value = 6; c.attack.value = 0.004; c.release.value = 0.12;
      const makeup = ctx.createGain(); makeup.gain.value = 1 + st.comp * 1.2;
      out.connect(c).connect(makeup); out = makeup;
    }
    out.connect(master);
    const send = ctx.createGain(); send.gain.value = st.wet; out.connect(send).connect(convolver);

    // swell: start a layer at a quarter level and ease it up over `swell` ms
    const layer = (buf, gain, delay, dest, swells) => {
      if (gain <= 0.001) return null;
      const t0 = now + (delay || 0);
      const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = st.pitch;
      const g = ctx.createGain(), rise = swells ? st.swell / 1000 : 0;
      if (rise > 0.001) {
        g.gain.setValueAtTime(gain * 0.25, t0);
        g.gain.setTargetAtTime(gain * 1.6, t0, rise * 0.6);
        g.gain.setTargetAtTime(gain, t0 + rise, rise);
      } else {
        g.gain.value = gain;
      }
      s.connect(g).connect(dest || bus); s.start(t0);
      return g;
    };
    layer(v.crack, st.crack);
    layer(v.bright, st.bright);
    layer(v.mid, st.mid, 0, null, true);
    layer(v.body, st.body, 0, null, true);
    layer(v.boom, st.boom, 0, null, true);
    if (st.slap > 0.01) {   // one dull copy of the blast off a nearby wall
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2200 * st.pitch; f.connect(bus);
      const d = rnd(0.095, 0.125);
      layer(v.mid, st.slap * 0.5, d, f);
      layer(v.body, st.slap * 0.6, d + 0.002, f);
    }
    const tg = layer(v.tail, st.tail * 0.6);
    if (tg) {
      const end = now + st.tailLen;
      tg.gain.setValueAtTime(st.tail * 0.6, now);
      tg.gain.setValueAtTime(st.tail * 0.6, Math.max(now, end - st.tailLen * 0.6));
      tg.gain.exponentialRampToValueAtTime(0.0005, end);
    }
  }

  function play(burst) {
    init().then(() => {
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime + 0.02, it = current, v = values(it);
      let dur = 0;
      if (it.kind === "clip") { playClip(it, v, now); const b = clipBufs[it.clip === "step" ? "step1" : it.clip]; dur = b ? b.duration / v.rate : 0; }
      else if (it.kind === "synth") playSynth(now);
      else if (it.kind === "action") dur = playAction(it, now);
      else if (it.boltClip) { playBoltClip(now, v.pitch, 0.42, 1.05); dur = 1.05 / v.pitch; }
      else if (burst && it.burst) { for (let i = 0; i < 10; i++) playGun(it, v, now + i * 0.1); }
      else {
        playGun(it, v, now); dur = gunSpan(it) / v.pitch;
        if (it.bolt) playBoltClip(now + 0.25, values(ITEMS.find((x) => x.boltClip)).pitch, 0.42, 1.05);   // the bolt after the shot, as in game
        if (it.pump) playAction(ITEMS.find((x) => x.kind === "action"), now + 0.14);                          // and the pump
      }
      if (dur > 0) { playhead = { start: now, dur }; startAnim(); }
    });
  }
  document.getElementById("play").addEventListener("click", (e) => { e.currentTarget.blur(); play(); });
  document.getElementById("burst").addEventListener("click", (e) => { e.currentTarget.blur(); play(true); });
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = e.target === searchEl;
    if (e.key === "/" && !typing) { e.preventDefault(); searchEl.focus(); return; }
    if (e.key === "Escape" && typing) { searchEl.blur(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (e.target.tagName === "INPUT" && e.target.type === "range") return;   // arrows nudge a focused slider
      e.preventDefault();
      const list = visibleItems(), i = list.indexOf(current);
      const next = list[Math.min(list.length - 1, Math.max(0, (i < 0 ? 0 : i + (e.key === "ArrowDown" ? 1 : -1))))];
      if (next) { select(next); play(); }
      return;
    }
    if (typing) return;
    if (e.repeat && (e.code === "Space" || e.key === "b" || e.key === "B")) { e.preventDefault(); return; }   // holding a key doesn't stack sounds
    if (e.code === "Space") { e.preventDefault(); play(); }
    if (e.key === "b" || e.key === "B") play(true);
  });

  buildList();
  select(ITEMS[0]);
  init();   // decode now (audio stays paused until the first play) so the waveforms can show
})();
</script>
</body>
</html>
